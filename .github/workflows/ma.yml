name: Build SHRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          apt-get update && apt-get install -y \
          git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
          x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev \
          libxml2-utils xsltproc unzip python2 python-is-python2

      - name: Setup Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Initialize and Sync
        run: |
          export PATH=~/bin:$PATH
          mkdir shrp
          cd shrp
          repo init -u https://github.com/SHRP/manifest.git -b v3_11.0
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Prepare Device Tree
        run: |
          # Copy your local device tree to the source tree
          # Adjust path based on your device tree structure
          mkdir -p shrp/device/oppo/A31
          cp -r * shrp/device/oppo/A31/ 
          # Note: Ensure the copy doesn't include the .github folder itself 
          # to avoid recursive errors.

      - name: Build SHRP
        run: |
          export PATH=~/bin:$PATH
          cd shrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_OP4C7D-eng
          mka recoveryimage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: SHRP_Recovery
          path: shrp/out/target/product/OP4C7D/*.img
