name: Sync mcRegistry Blobs

on:
  workflow_dispatch: # Allows you to run this manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Source Repo
        run: |
          git clone --depth 1 -b main https://github.com/KAGA-KOKO/android-recovery-OP4C7D source_repo

      - name: Copy mcRegistry Files
        run: |
          # Create the destination directory if it doesn't exist
          mkdir -p recovery/root/vendor/app/mcRegistry
          
          # Copy all drbin, tlbin, and tabin files
          cp -r source_repo/recovery/root/vendor/app/mcRegistry/* recovery/root/vendor/app/mcRegistry/
          
          # Clean up the cloned source
          rm -rf source_repo

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add recovery/root/vendor/app/mcRegistry/*
          git commit -m "Sync: Update mcRegistry blobs from KAGA-KOKO" || exit 0
          git push

