name: TWRP 10 Build - A31 Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged

    env:
      # This prevents the tzdata prompt you encountered
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Kolkata

    steps:
    - name: Prepare Environment
      run: |
        apt-get update
        # Install tzdata first with noninteractive flag
        apt-get install -y tzdata
        apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
        libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python2 bc

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        # Ensure python2 is linked (Required for Android 10 repo sync)
        ln -sf /usr/bin/python2 /usr/bin/python

    - name: Initialize & Sync Repo
      run: |
        export PATH=$HOME/bin:$PATH
        mkdir twrp && cd twrp
        git config --global user.name "ansh-m14x"
        git config --global user.email "ansh@example.com"
        repo init --depth=1 -u https://github.com/minimal-twrp/android_bootable_recovery.git -b android-10
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/ansh-m14x/android_recovery_retrofit_OP4C7D -b android-10 device/oppo/OP4C7D

    - name: Build Recovery
      run: |
        cd twrp
        export PATH=$HOME/bin:$PATH
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_OP4C7D-eng
        make recoveryimage -j$(nproc --all)

    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-A31-Recovery
        path: twrp/out/target/product/OP4C7D/recovery.img
